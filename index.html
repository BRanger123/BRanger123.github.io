<!DOCTYPE html>
<html>
    <head>
        <title>Best website ever</title>
        <link rel="stylesheet" href="website.css">
    </head>
    <body id="body"> 
        <div id="menu">
            <h1>Bricklet</h1>
            <h3>By Barnaby Ranger</h3>
            <h2>Press M to go back here at any time</h2><br>
            <div class="buttonContainer">
                <button id="startButton" onclick="websiteGoTo('levelsMenu')">Start</button><br>
                <button id="settingsButton" onclick="websiteGoTo('settings')">Information</button><br>
                <button id="questionButton" onclick="startQuestion()">Question</button><br>
                <button id="quitButton" onclick="exiting=true, websiteGoTo('exitGame')">Exit</button><br>
            </div>
        </div>

        <div id="gameWindow" style="display: none">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="levelsMenu" style="display: none">
            <h1>Level Select</h1>
            <h2>Level 2 is my favourite</h2>
            <div class="buttonContainer">
                <button onclick="playLevel(1)">Level 1</button><br>
                <button onclick="upgradeValue=0; playLevel(2)">Level 2</button><br>
                <button onclick="playLevel(3)">Level 3</button>
            </div>
            <button onclick="websiteGoTo('menu')" id="backButton">Back</button>
        </div>

        <div id="settings" style="display: none">
            <h1>Information</h1>
            <h2>Version 2 Patch Notes:</h2>
            <h3>Questions section added</h3><br><br>
            <button onclick="websiteGoTo('menu')" id="backButton">Back</button>
        </div>

        <div id="upgrade" style="display: none;">
            <h1>Shop</h1>
            <h2>Choose an upgrade:</h2>
            <div class="buttonContainer">
                <button onclick="upgradeValue = 1; websiteGoTo('gameWindow')">Gain 100 health</button><br>
                <button onclick="upgradeValue = 2; websiteGoTo('gameWindow')">Damage increase</button><br>
                <button onclick="upgradeValue = 3; websiteGoTo('gameWindow')">Round Capacity +3</button><br>
                <button onclick="upgradeValue = 4; websiteGoTo('gameWindow')">50 Ammo</button><br>
            </div>
            <h2>Buy a gun:</h2>
            <div class="buttonContainer">
                <h2>Under construction</h2>
                <!--<button onclick="">Sniper</button><br>
                <button onclick="">Machine gun</button><br>
                <button onclick="">Test 3</button><br>-->
            </div>
        </div>

        <div id="questions" style="display: none;">
            <h1>Question Round</h1>
            <h2 id="question"></h2>
            <div class="buttonContainer">
                <button id="answer1" onclick="checkAnswer(1)"></button><br>
                <button id="answer2" onclick="checkAnswer(2)"></button><br>
                <button id="answer3" onclick="checkAnswer(3)"></button><br>
                <button id="answer4" onclick="checkAnswer(4)"></button><br>
            </div>
            <button onclick="websiteGoTo('menu')" id="backButton">Back</button>
        </div>

        <script type="module" src="website.js"></script>
        <script>
            let upgradeValue = 0
            let levelGlobal = -1            // Global variables must load first
            let currentDivId = "menu"
            let currentQuestion = -1
            function getQuestions() {
                const xhr = new XMLHttpRequest()
                xhr.open('GET', 'questions.txt', false)
                xhr.send()
                if (xhr.status === 200) {
                    return xhr.responseText.trim().split('\n').map(line => {
                        const parts = line.split(',')
                        return {
                            question: parts[0].trim(),
                            answers: parts.slice(1).map(a => a.trim()),
                        }
                    })
                }
                console.error('Failed to load questions.txt')
                return []
            }
            const questions = getQuestions()
            // Now define functions for website navigation and level loading

            var input = document.getElementById("body")
            input.addEventListener("keypress", function(event) {
                const gameIsVisible = document.getElementById('gameWindow').style.display !== 'none'
                if (event.key === "m") {
                    event.preventDefault()
                    playLevel(levelGlobal)
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'w' }))
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'a' }))
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 's' }))
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'd' }))
                    document.getElementById('gameWindow').style.display = 'none'
                    websiteGoTo('menu')
                }
            })
            input.addEventListener("keypress", function(event) {
                const gameIsVisible = document.getElementById('gameWindow').style.display !== 'none'
                if (event.key === "r" && gameIsVisible) {
                    event.preventDefault()
                    go(levelGlobal)
                }
            })

            function websiteGoTo(divId){
                document.getElementById(currentDivId).style.display = "none"        // When called, must use div id in '' for function call
                document.getElementById(divId).style.display = "inline-block"
                currentDivId = divId
            }
            
            function playLevel(level){
                levelGlobal = level
                document.getElementById(currentDivId).style.display = 'none'
                document.getElementById('gameWindow').style.display = 'inline-block'
                currentDivId = "gameWindow"
                go("startButton")
            }

            function shuffleArray(array){
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1))
                    const temp = array[i]
                    array[i] = array[j]
                    array[j] = temp
                }
                return array
            }

            function resetAnswerButtons(){
                for (let i = 1; i <= 4; i++) {
                    const button = document.getElementById(`answer${i}`)
                    button.disabled = false
                    button.style.backgroundColor = ''
                    button.style.color = ''
                }
            }

            function startQuestion(){
                websiteGoTo('questions')
                const sourceQuestion = questions[Math.floor(Math.random() * questions.length)]
                const shuffledAnswers = shuffleArray(sourceQuestion.answers.map((text, idx) => ({
                    text,
                    isCorrect: idx === 0,
                })))
                currentQuestion = {
                    question: sourceQuestion.question,
                    answers: shuffledAnswers,
                }
                document.getElementById('question').textContent = currentQuestion.question || ''
                resetAnswerButtons()
                currentQuestion.answers.forEach((answer, index) => {
                    const button = document.getElementById(`answer${index + 1}`)
                    button.textContent = answer.text || ''
                    button.onclick = () => checkAnswer(index)
                })
            }

            function checkAnswer(index){
                if (!currentQuestion) return
                const selectedAnswer = currentQuestion.answers[index]
                if (!selectedAnswer) return
                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`answer${i}`).disabled = true
                }
                if (selectedAnswer.isCorrect) {
                    document.getElementById(`answer${index + 1}`).style.backgroundColor = 'lightgreen'
                    // alert('Correct answer!')
                }
                else {
                    document.getElementById(`answer${index + 1}`).style.backgroundColor = 'salmon'
                    const correctIndex = currentQuestion.answers.findIndex(ans => ans.isCorrect)
                    if (correctIndex >= 0) {
                        document.getElementById(`answer${correctIndex + 1}`).style.backgroundColor = 'lightgreen'
                    }
                    // alert('Incorrect answer.')
                }
            }

            websiteGoTo('menu')
        </script>
        <div id="exitGame" style="display: none">
            <h1>Goodbye!</h1>
        </div>
    </body>
</html>
